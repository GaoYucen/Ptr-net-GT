experiment:
  name: component_merge_tsp100
  seed: 1234

problem:
  name: tsp
  size: 100

model:
  name: component_merge
  embedding_dim: 128
  hidden_dim: 128
  context_mode: cross_step
  action_mode: joint_edge

training:
  batch_size: 512
  epoch_size: 65536
  epochs: 100
  learning_rate: 0.0001
  baseline: rollout

data:
  train_dataset: data/tsp_uniform/tsp100_train_65536.pt
  val_dataset: data/tsp_uniform/tsp100_val_10000.pt
  test_dataset: data/tsp_uniform/tsp100_test_10000.pt
  baseline_dataset: data/tsp_uniform/tsp100_val_10000.pt

evaluation:
  batch_size: 512
  dataset: data/tsp_uniform/tsp100_test_10000.pt

output:
  root: outputs