experiment:
  name: attention_model_tsp20
  seed: 1234

problem:
  name: tsp
  size: 20

model:
  name: attention_model
  embedding_dim: 128
  hidden_dim: 128
  n_encode_layers: 2
  n_heads: 8

training:
  batch_size: 512
  epoch_size: 65536
  epochs: 10
  learning_rate: 0.0001
  baseline: rollout
  no_progress_bar: true
  log_step: 0
  progress_bar_mininterval: 30.0
  early_stop_patience: 3
  early_stop_min_delta: 0.001

budget:
  protocol: same_training_budget_v1
  decode_type: greedy
  seeds: [1234, 1235, 1236]

evaluation:
  batch_size: 512
  dataset: data/tsp_uniform/tsp20_test_10000.pt

output:
  root: outputs