[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ptrnet-gt"
version = "0.1.0"
description = "Ptr-net-GT: component-merge decoding with group-theoretic structure for TSP"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[tool.setuptools]
packages = ["ptrnet_gt"]