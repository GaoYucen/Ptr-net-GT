[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groupopt"
version = "0.1.0"
description = "A model-agnostic group-theoretic construction framework for combinatorial optimization"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
ml = [
    "torch>=2.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
